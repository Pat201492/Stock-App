<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Politician — Stock Tracker</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
  <script src="/static/nav-mobile.js?v=1"></script>
</head>
<body>

<nav>
  <span class="nav-brand">Stock<span>Tracker</span></span>
  <div class="nav-links">
    <a href="/">Screener</a>
    <a href="/etf">ETFs</a>
    <a href="/fed">Fed</a>
    <a href="/account">Portfolio</a>
    <a href="/static/news.html">News</a>
    <a href="/politicians" class="active">Congressional</a>
    <a href="/insiders">Insiders</a>
    <a href="/distribution">Distribution</a>
    <a href="/audit">Audit</a>
    <a href="/debug">Debug</a>
    <a href="/methodology">Methodology</a>
  </div>
</nav>

<div class="container">
  <div class="breadcrumb"><a href="/politicians">← Back to Congressional Trades</a></div>

  <div class="stock-header" id="pol-header">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="grid-2" style="margin-bottom:20px">
    <div class="card">
      <div class="card-title">Committees</div>
      <div id="committees"></div>
    </div>
    <div class="card">
      <div class="card-title">Most-Traded Tickers</div>
      <div id="top-tickers"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" id="trades-title">Recent Trades</div>
    <div class="table-wrap" style="border:none">
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Score</th>
            <th>Type</th>
            <th style="text-align:right">Amount</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="trades-body">
          <tr><td colspan="5"><div class="loading"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const bioguide = location.pathname.split("/").filter(Boolean).pop();
const assetFilter = new URLSearchParams(location.search).get("asset") || "";

function fmtAmt(min, max) {
  if (min == null) return "—";
  const m = (min + max) / 2;
  if (m >= 1e6) return `$${(m/1e6).toFixed(1)}M`;
  if (m >= 1e3) return `$${(m/1e3).toFixed(0)}K`;
  return `$${m.toFixed(0)}`;
}

function typeBadge(t) {
  const color = t === "purchase" ? "#22c55e" : t && t.startsWith("sale") ? "#ef4444" : "#94a3b8";
  return `<span style="color:${color};font-weight:600;font-size:12px">${t || "?"}</span>`;
}

function scoreBadge(s, label) {
  if (s == null) return `<span class="muted">—</span>`;
  const color = s >= 70 ? "#22c55e" : s >= 55 ? "#3b82f6" : s >= 40 ? "#f59e0b" : "#ef4444";
  return `<span style="color:${color};font-weight:600">${s}</span>
          <span style="color:var(--muted);font-size:11px;margin-left:4px">${label || ""}</span>`;
}

async function init() {
  const qs = assetFilter ? `?asset=${encodeURIComponent(assetFilter)}` : "";
  const d = await fetch(`/api/pol/politician/${bioguide}${qs}`).then(r => r.json()).catch(() => null);
  if (!d || d.error) {
    document.getElementById("pol-header").innerHTML =
      `<div class="empty">Politician not found.</div>`;
    return;
  }

  const p = d.politician;
  document.title = `${p.first_name} ${p.last_name} — Stock Tracker`;

  document.getElementById("pol-header").innerHTML = `
    <div class="stock-title">
      <div class="ticker">${p.first_name} ${p.last_name}</div>
      <div class="company-name">${p.chamber === "sen" ? "Senator" : p.chamber === "rep" ? "Representative" : p.chamber || ""}</div>
      <div class="tags">
        ${p.party    ? `<span class="tag">${p.party}</span>` : ""}
        ${p.state    ? `<span class="tag">${p.state}</span>` : ""}
        ${p.district ? `<span class="tag">District ${p.district}</span>` : ""}
        ${p.active   ? `<span class="tag" style="background:rgba(34,197,94,.15);color:var(--green)">Active</span>`
                     : `<span class="tag" style="background:rgba(148,163,184,.15);color:var(--muted)">Former</span>`}
      </div>
    </div>
    <div class="stock-price">
      <div class="price-val">${d.total_trades.toLocaleString()}</div>
      <div class="mkt-cap">total trades</div>
    </div>`;

  // Committees
  const committees = d.committees || [];
  document.getElementById("committees").innerHTML = committees.length
    ? committees.map(c => `
        <div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">
          <div style="font-weight:600">${c.name || c.committee_id}</div>
          <div style="color:var(--muted);font-size:11px">${c.role}</div>
        </div>`).join("")
    : `<div class="empty" style="padding:24px">No committee data — run pol_refresh --committees</div>`;

  // Top tickers
  const tops = d.top_tickers || [];
  document.getElementById("top-tickers").innerHTML = tops.length
    ? tops.map(t => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">
          <a href="/stock/${t.ticker}" class="ticker-cell">${t.ticker}</a>
          <span><span style="color:var(--muted);margin-right:8px">${t.count}×</span>
            <span style="font-weight:600">$${((t.volume||0)/1e3).toFixed(0)}K</span></span>
        </div>`).join("")
    : `<div class="empty">No trades</div>`;

  // Recent trades — fetch stock scores for real tickers (skip the TREAS sentinel)
  if (assetFilter === "treasury")
    document.getElementById("trades-title").textContent = "Treasury / Bond Purchases";
  const trades = d.recent_trades || [];
  const tickers = [...new Set(trades.map(t => t.ticker))].filter(tk => tk !== "TREAS");
  const scoreMap = {};
  await Promise.all(tickers.map(async tk => {
    const s = await fetch(`/api/stocks/${tk}/score`).then(r => r.json()).catch(() => null);
    if (s && !s.error) scoreMap[tk] = { composite: s.composite, label: s.label };
  }));

  document.getElementById("trades-body").innerHTML = trades.length
    ? trades.map(t => {
        const isTreas = t.ticker === "TREAS";
        const nameCell = isTreas
          ? `<span title="${t.asset || "Treasury"}">${t.asset || "U.S. Treasury"}</span>`
          : `<a href="/stock/${t.ticker}" class="ticker-cell">${t.ticker}</a>`;
        const sc = scoreMap[t.ticker];
        return `
          <tr>
            <td>${nameCell}</td>
            <td>${sc ? scoreBadge(sc.composite, sc.label) : `<span class="muted">—</span>`}</td>
            <td>${typeBadge(t.transaction_type)}</td>
            <td style="text-align:right;font-weight:600">${fmtAmt(t.amount_min, t.amount_max)}</td>
            <td class="muted" style="font-size:12px">${t.transaction_date || "—"}</td>
          </tr>`;
      }).join("")
    : `<tr><td colspan="5"><div class="empty">No ${assetFilter === "treasury" ? "Treasury" : ""} trades</div></td></tr>`;
}

init();
</script>
</body>
</html>
