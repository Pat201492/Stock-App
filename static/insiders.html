<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insider Trades — Stock Tracker</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
  <script src="/static/nav-mobile.js?v=1"></script>
</head>
<body>

<nav>
  <span class="nav-brand">Stock<span>Tracker</span></span>
  <div class="nav-links">
    <a href="/">Screener</a>
    <a href="/etf">ETFs</a>
    <a href="/fed">Fed</a>
    <a href="/account">Portfolio</a>
    <a href="/static/news.html">News</a>
    <a href="/politicians">Congressional</a>
    <a href="/insiders" class="active">Insiders</a>
    <a href="/distribution">Distribution</a>
    <a href="/audit">Audit</a>
    <a href="/debug">Debug</a>
  </div>
</nav>

<div class="container">
  <h2 style="margin-bottom:4px">Insider Trades</h2>
  <p style="color:var(--muted);margin-bottom:24px;font-size:13px">
    SEC Form 4 filings — corporate insiders (executives, directors, 10%+ shareholders)
  </p>

  <div class="filters">
    <input type="text" id="ticker-filter" placeholder="Filter by ticker…" oninput="loadFeed()" />
    <select id="type-filter" onchange="loadFeed()">
      <option value="">All Types</option>
      <option value="P">Purchase</option>
      <option value="S">Sale</option>
      <option value="A">Award</option>
      <option value="M">Option Exercise</option>
    </select>
    <select id="days-filter" onchange="loadFeed()">
      <option value="">All Time</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="resetFilters()">Clear</button>
    <span id="feed-count" style="color:var(--muted);font-size:12px;margin-left:auto"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Insider</th>
          <th>Title</th>
          <th>Type</th>
          <th style="text-align:right">Shares</th>
          <th style="text-align:right">Price</th>
          <th style="text-align:right">Value</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="feed-body">
        <tr><td colspan="8"><div class="loading"><div class="spinner"></div>Loading…</div></td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>← Prev</button>
    <span id="page-info">Page 1</span>
    <button class="page-btn" id="btn-next" onclick="changePage(1)">Next →</button>
  </div>
</div>

<script>
let feedPage = 0;
const PAGE_SIZE = 50;

const TYPE_LABEL = {
  "P": "Purchase",  "S": "Sale", "A": "Award", "M": "Option Exercise",
  "G": "Gift", "F": "Tax Withhold", "D": "Disposition",
};

function typeBadge(t) {
  const color = t === "P" ? "#22c55e" : t === "S" || t === "D" ? "#ef4444" : "#94a3b8";
  return `<span style="color:${color};font-weight:600;font-size:12px">${TYPE_LABEL[t] || t || "?"}</span>`;
}

function fmtVal(v) {
  if (v == null) return "—";
  if (v >= 1e6) return `$${(v/1e6).toFixed(2)}M`;
  if (v >= 1e3) return `$${(v/1e3).toFixed(0)}K`;
  return `$${v.toFixed(0)}`;
}

async function loadFeed() {
  feedPage = 0;
  await fetchPage();
}

async function fetchPage() {
  const ticker = document.getElementById("ticker-filter").value.trim();
  const type   = document.getElementById("type-filter").value;
  const days   = document.getElementById("days-filter").value;
  const params = new URLSearchParams({ limit: PAGE_SIZE, offset: feedPage * PAGE_SIZE });
  if (ticker) params.set("ticker", ticker);
  if (type)   params.set("txn_type", type);
  if (days)   params.set("days", days);

  const d = await fetch(`/api/insider/trades?${params}`).then(r => r.json()).catch(() => ({trades:[], total:0}));
  document.getElementById("feed-count").textContent = `${d.total.toLocaleString()} filings`;

  const tbody = document.getElementById("feed-body");
  if (!d.trades.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty">
      No insider trades. Run python pol_refresh.py --edgar to populate.
    </div></td></tr>`;
  } else {
    tbody.innerHTML = d.trades.map(t => `
      <tr>
        <td><a href="/stock/${t.ticker}" class="ticker-cell">${t.ticker}</a></td>
        <td style="font-weight:600">${t.insider_name || "—"}</td>
        <td class="muted" style="font-size:12px">${t.insider_title || "—"}</td>
        <td>${typeBadge(t.transaction_type)}</td>
        <td style="text-align:right">${t.shares ? Math.round(t.shares).toLocaleString() : "—"}</td>
        <td style="text-align:right" class="muted">${t.price_per_share ? `$${t.price_per_share.toFixed(2)}` : "—"}</td>
        <td style="text-align:right;font-weight:600">${fmtVal(t.total_value)}</td>
        <td class="muted" style="font-size:12px">${t.transaction_date || "—"}</td>
      </tr>`).join("");
  }

  document.getElementById("page-info").textContent = `Page ${feedPage + 1} of ${Math.max(1, Math.ceil(d.total / PAGE_SIZE))}`;
  document.getElementById("btn-prev").disabled = feedPage === 0;
  document.getElementById("btn-next").disabled = (feedPage + 1) * PAGE_SIZE >= d.total;
}

function changePage(delta) {
  feedPage = Math.max(0, feedPage + delta);
  fetchPage();
}

function resetFilters() {
  document.getElementById("ticker-filter").value = "";
  document.getElementById("type-filter").value   = "";
  document.getElementById("days-filter").value   = "";
  loadFeed();
}

loadFeed();
</script>
</body>
</html>
